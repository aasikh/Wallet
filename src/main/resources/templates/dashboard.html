<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
 <h2 style="text-algin:center;">Welcome to <span th:text="${name}"> </span></h2>

<div th:if="${wallet==null}">
<h3> Wallet Status : Not Created</h3>
    <form action="/create" method="post">
        <button type="submit">Create Wallet </button>
    </form>
    <p>Check Balance 🔒</p>
    <p>Deposit 🔒</p>
    <p>Create wallet to access these services.</p>
</div>



 <div th:if="${wallet != null}">

     <p>Wallet Status: Active</p>

     <a href="/checkBalance">Check Balance</a> <br> <br>

     <a href="/deposite">Deposit</a> <br> <br>
     <a href="/transferForm">Send Amount</a> <br> <br>
 </div>

 <p th:if="${balance}" th:text="${balance}"></p>
 <p th:if="${depositeResponse}" th:text="${depositeResponse}" ></p>
 <p th:if="${walletCreated}" th:text="${walletCreated}"></p>
 <p th:if="${transferMessage}" th:text="${transferMessage}"></p>


<a href="logout">LogOut</a>
</body>
</html>
